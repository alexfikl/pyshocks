[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.10" ]

[project]
name = "pyshocks"
version = "2025.10"
description = "Adjoint-based optimization of flows with shocks"
readme = "README.rst"
keywords = [
    "jax",
    "optimization",
    "shocks",
    "weno",
]
license = "MIT"
maintainers = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
authors = [
    { name = "Alexandru Fikl", email = "alexfikl@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "jax>=0.6",
    "jaxlib>=0.6",
    "numpy>=2.1",
    "rich",
    "typing-extensions>=4.10",
]
# NOTE: this is only here for readthedocs (keep in sync with the dependency group)
optional-dependencies.docs = [
    "sphinx>=6",
    "sphinx-book-theme",
]
urls.Documentation = "https://pyshocks.readthedocs.io"
urls.Repository = "https://github.com/alexfikl/pyshocks"

[dependency-groups]
dev = [ "pyproject-fmt", "reuse", "typos", "uv" ]
test = [ "pytest", "ruff", "scipy-stubs", "ty" ]
vis = [ "matplotlib", "scienceplots" ]

[tool.hatch]
# NOTE: needed for PyWENO use from git
metadata.allow-direct-references = true
build.targets.wheel.packages = [
    "src/pyshocks",
]
build.targets.sdist.exclude = [
    ".ci",
    ".github",
    "docs/_build",
]

[tool.ruff]
target-version = "py310"
line-length = 88
preview = true
lint.select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # flake8
    "F",   # flake8
    "FBT", # flake8-boolean-trap
    "G",   # flake8-logging-format
    "I",   # flake8-isort
    "ISC", # flake8-implicit-str-concat
    "N",   # pep8-naming
    "NPY", # numpy
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RUF", # ruff
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # flake8
]
lint.ignore = [
    "assert",                                    # assert
    "exec-builtin",                              # exec-builtin
    "if-else-block-instead-of-if-exp",           # use-ternary-operator
    "import-outside-top-level",                  # import-outside-top-level
    "invalid-argument-name",                     # invalid-argument-name
    "magic-value-comparison",                    # magic-value-comparison
    "module-import-not-at-top-of-file",          # module-import-not-at-top-of-file
    "non-augmented-assignment",                  # non-augmented-assignment
    "non-empty-init-module",                     # non-empty-init-module
    "non-lowercase-variable-in-function",        # non-lowercase-variable-in-function
    "single-line-implicit-string-concatenation", # single-line-implicit-string-concatenation
    "stdlib-module-shadowing",                   # shadowing-builtin-module
    "suspicious-pickle-import",                  # suspicious-pickle-import
    "suspicious-pickle-usage",                   # suspicious-pickle-usage
    "too-many-arguments",                        # too-many-arguments
    "too-many-branches",                         # too-many-branches
    "too-many-locals",                           # too-many-locals
    "too-many-positional-arguments",             # too-many-positional
    "too-many-statements",                       # too-many-statements
    "too-many-statements-in-try-clause",         # too-many-statements-in-try
    "unnecessary-dunder-call",                   # unnecessary-dunder-call
]
lint.per-file-ignores."pyshocks/__init__.py" = [
    "boolean-positional-value-in-call",
]
lint.flake8-quotes.docstring-quotes = "double"
lint.flake8-quotes.inline-quotes = "double"
lint.flake8-quotes.multiline-quotes = "double"
lint.isort.known-first-party = [
    "pyshocks",
]

[tool.pytest]
ini_options.testpaths = "tests"
ini_options.addopts = [
    "-rswx",
    "--durations=25",
    "--capture=no",
    "--verbose",
]
